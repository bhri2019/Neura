.chs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.chs div{background:var(--bg);border-radius:14px;padding:8px 12px}.chs b{display:block;direction:ltr;text-align:right;color:var(--ink);font-size:clamp(15px,1.4vw,18px)}.chs span{font-size:clamp(12px,1.1vw,15px);color:var(--mut)}
.cd{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.cd pre{font-size:clamp(11px,1.05vw,14px)}.cd b{font-size:14px;color:var(--mut);display:block;margin-bottom:4px}
.gr2{display:flex;gap:clamp(14px,3vw,40px);align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}.gr2 .donut{margin:0;width:clamp(130px,15vw,210px);height:clamp(130px,15vw,210px)}
.vb2{display:flex;gap:clamp(14px,2vw,28px);align-items:flex-end;height:clamp(130px,14vw,190px);direction:ltr;border-bottom:2px solid var(--line);padding:0 10px}.vb2>div{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}.vb2 .g{display:flex;gap:4px;align-items:flex-end;flex:1}.vb2 i{width:clamp(14px,1.7vw,24px);border-radius:4px 4px 0 0}.vb2 span{font-size:12px;color:var(--mut)}

@media(max-width:1000px){.tri{grid-template-columns:1fr;perspective:none}.pnl{min-height:0}.pnl.wr,.pnl.wl{transform:none}.pnl.c{order:-1}.tb{width:100%}.r2,.cd{grid-template-columns:1fr}}

<body>
<div class="wrap">
 <header class="hero">
  <div><div class="en">AI-Native Programming Language</div><h1>NEURA</h1><p>لغة برمجة للذكاء الاصطناعي: اكتب النموذج، ونيورا تتولى التنفيذ والتحسين.</p></div>
  <div class="btns"><button class="btn" id="go">ابدأ العرض</button><button class="btn g" id="rnd">تصفح الأقسام</button></div>
 </header>
 <p class="hint">اضغط على أي قسم ليتكبّر. استخدم الأسهم ← → للتنقل و Esc للإغلاق.</p>
 <main class="grid" id="grid"></main><section class="poster" id="board"></section>
</div>
<button class="tg" id="tg" aria-label="تبديل الوضع الليلي">◐</button>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="pn" id="pn"></div></div>
<script>
const bar=(a,col)=>a.map(([l,v,m,u])=>`<div class="bar" style="--col:${col||'var(--a)'}"><span>${l}</span><div><b data-w="${v/m*100}"></b></div><span>${v}${u||''}</span></div>`).join('');
const pie=[['إعداد البيانات',30,'#5b3df5'],['تحسين الأداء يدوياً',25,'#e8590c'],['إدارة الذاكرة والأجهزة',20,'#00a88f'],['تصميم النموذج',25,'#f2b705']];
let g=0;const cg=pie.map(p=>{const s=g;g+=p[1];return `${p[2]} ${s}% ${g}%`}).join(',');
const steps=[['Neura Source','الكود','يكتب المطور النموذج بصياغة بسيطة قريبة من Python، بلا أي ذكر للذاكرة أو الأجهزة.'],['Parser','المحلّل','Lexer ثم Parser يبنيان شجرة (AST)، ثم فاحص الأنواع (Type Checker) وفاحص الملكية (Ownership Checker) يتحققان من الأنواع وأشكال المصفوفات (Shapes) مبكراً قبل التشغيل.'],['Tensor IR','التمثيل الوسيط','أربع طبقات تمثيل وسيط: NIR ثم TIR ثم ADIR (الاشتقاق التلقائي بالنمط العكسي) ثم EIR (للتنفيذ).'],['Optimizer','المحسّن','تمرّات تحسين على LM ضمن محرك NAOE: الرسم البياني، دمج العمليات (Kernel Fusion)، الذاكرة، الدقة، اختيار الجهاز، والضبط التلقائي (Autotuning).'],['Codegen','التوليد','LLM لكود CPU الأصلي، و CUDA/ROCm لمعالجات الرسوميات حسب الجهاز المتوفر. الإصدار 0.1.0 ينفّذ حالياً على آلة EIR الافتراضية مع Kernels أصلية بـ Rust.'],['Runtime','وقت التشغيل','Runtime مكتوب بـ Rust: آلة EIR الافتراضية، محرك Autograd، الطبقات والمُحسّنات، ومُحلّل الأداء (Profiler).']];
const S=[
{i:'⚠️',t:'المشكلة',e:'The Problem',c:'#e8590c',m:2,s:'مطور الذكاء الاصطناعي يقضي وقتاً طويلاً خارج بناء النموذج نفسه.',mini:[30,25,20,25],
 h:()=>`<p class="lead">Python سهلة، لكن الأداء والتحسين يُدفعان إلى المطور أو إلى مكتبات خارجية.</p>
 <div class="two"><div class="card"><h4>أين يذهب وقت المطور؟</h4><div class="donut" style="background:conic-gradient(${cg})"></div><div class="leg" style="margin-top:12px">${pie.map(p=>`<span><i style="background:${p[2]}"></i>${p[0]} ${p[1]}%</span>`).join('')}</div><p style="margin-top:8px;font-size:12.5px">أرقام توضيحية لتقريب الفكرة وليست نتيجة دراسة.</p></div>
 <div class="card"><h4>التحديات الأساسية</h4><ul><li>أداء Python الأصلي محدود دون مكتبات مسرّعة.</li><li>إدارة ذاكرة GPU معقدة ومصدر أخطاء.</li><li>دمج Kernels وتحسين Tensor يحتاج خبرة نادرة.</li><li>نقل المشروع بين CPU وGPU وأنواعهما يتطلب تعديلات.</li></ul></div></div>
 <div class="card"><h4>النتيجة</h4><p>فرق صغيرة وطلاب وباحثون يخسرون وقتاً في التفاصيل الهندسية بدل الابتكار في النماذج.</p></div>`},
{i:'💡',t:'الحل',e:'The Solution',c:'#5b3df5',m:2,s:'اكتب النموذج فقط. الذاكرة والتحسين واختيار الجهاز مسؤولية اللغة.',mini:[10,45,25,40],
 h:()=>`<p class="lead">Neura تجعل التحسين جزءاً من اللغة نفسها، لا من مسؤولية المطور.</p>
 <div class="two"><div><span class="lab">الطريقة التقليدية: تفاصيل كثيرة</span><pre>x = x.to(device)       # اختيار الجهاز
buf = cuda.alloc(n)    # ذاكرة يدوية
y = matmul(x, W)       # Kernel 1
y = add(y, b)          # Kernel 2
y = gelu(y)            # Kernel 3
cuda.free(buf)</pre></div>
 <div><span class="lab">مع Neura: النية فقط</span><pre>model = nn.Sequential([
  nn.Linear(2, 8),
  nn.ReLU(),
  nn.Linear(8, 3)
])
optimizer = optim.Adam(model.parameters(), learning_rate=0.05)
model.train(train, epochs=20, batch_size=8, optimizer=optimizer)</pre></div></div>
 <div class="two"><div class="card"><h4>ما الذي تفعله Neura تلقائياً؟</h4><ul><li>إدارة الذاكرة</li><li>دمج العمليات المتوافقة</li><li>اختيار CPU أو GPU</li><li>حساب الـ Gradients</li></ul></div><div class="card"><h4>ما الذي يبقى للمطور؟</h4><p>تصميم النموذج، اختيار البيانات، وتفسير النتائج. هذا هو العمل الإبداعي الفعلي.</p></div></div>`},
